name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - run: npm ci
    - run: npm run lint
    - run: npm run test
    - run: npm run coverage
    - run: npm run build
    - run: npm run test:package
    - run: npm pack --dry-run
